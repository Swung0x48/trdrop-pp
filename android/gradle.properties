org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
android.useAndroidX=true
kotlin.code.style=official

# Native dependencies, relative to this folder (see README.md). Override on the command line with -P... or in
# ~/.gradle/gradle.properties.
#   the unpacked OpenCV Android SDK (the folder that contains sdk/)
trdrop.opencvAndroidSdk=../.deps/opencv-android/OpenCV-android-sdk
#   FFmpeg built with build-ffmpeg.sh (the folder that contains arm64-v8a/)
trdrop.ffmpegAndroid=../.deps/ffmpeg-android
